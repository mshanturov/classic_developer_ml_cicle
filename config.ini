[DATA]
raw_data = data/seeds_dataset.txt
x_data = data/Seeds_X.csv
y_data = data/Seeds_y.csv

[SPLIT_DATA]
x_train = data/Train_Seeds_X.csv
y_train = data/Train_Seeds_y.csv
x_test = data/Test_Seeds_X.csv
y_test = data/Test_Seeds_y.csv

[LOG_REG]
path = experiments/log_reg.sav

[RAND_FOREST]
n_estimators = 300
criterion = gini
max_depth = 8
random_state = 42
path = experiments/rand_forest.sav

[KNN]
n_neighbors = 5
metric = minkowski
p = 2
path = experiments/knn.sav

[SVM]
kernel = rbf
random_state = 42
path = experiments/svm.sav

[GNB]
path = experiments/gnb.sav

[D_TREE]
criterion = gini
path = experiments/d_tree.sav

[API]
default_model = RAND_FOREST

[REDIS]
url_env = REDIS_URL
key_prefix_env = REDIS_KEY_PREFIX
backend_env = PREDICTION_STORE_BACKEND
host_env = REDIS_HOST
port_env = REDIS_PORT
db_env = REDIS_DB
password_env = REDIS_PASSWORD
host_file_env = REDIS_HOST_FILE
port_file_env = REDIS_PORT_FILE
db_file_env = REDIS_DB_FILE
password_file_env = REDIS_PASSWORD_FILE

[VAULT]
password_env = ANSIBLE_VAULT_PASSWORD
bootstrap_redis_password_env = BOOTSTRAP_REDIS_PASSWORD

