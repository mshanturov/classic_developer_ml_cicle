services:
  model-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-api
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'curl -fsS http://localhost:8000/health || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  functional-tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cd"]
    depends_on:
      model-api:
        condition: service_healthy
    environment:
      - RUN_CONTAINER_SCENARIO=1
    command: ["python3", "-m", "pytest", "tests/test_functional_scenario.py", "-q"]
