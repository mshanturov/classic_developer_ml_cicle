version: '3.8'

services:
  redis:
    image: redis:7.4-alpine
    container_name: classic-ml-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    image: mshanturov/classic_developer_ml_cicle:latest
    container_name: classic-ml-api
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-dev:
    build: .
    profiles: ["dev"]
    command: >
      bash -c "python3 src/preprocess.py && python3 src/train.py --model ALL --use-config &&
      python3 -m uvicorn src.api_service:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    ports:
      - "8012:8000"

  functional-tests:
    build: .
    profiles: ["cd"]
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python3", "src/functional_api_test.py"]
