version: '3.8'

services:
  vault-init:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
      args:
        BOOTSTRAP_VAULT_PASSWORD: ${ANSIBLE_VAULT_PASSWORD}
        BOOTSTRAP_REDIS_PASSWORD: ${BOOTSTRAP_REDIS_PASSWORD}
        BOOTSTRAP_KAFKA_BOOTSTRAP_SERVERS: ${BOOTSTRAP_KAFKA_BOOTSTRAP_SERVERS}
        BOOTSTRAP_KAFKA_TOPIC: ${BOOTSTRAP_KAFKA_TOPIC}
        BOOTSTRAP_KAFKA_GROUP_ID: ${BOOTSTRAP_KAFKA_GROUP_ID}
    container_name: classic-ml-vault-init
    environment:
      ANSIBLE_VAULT_PASSWORD: ${ANSIBLE_VAULT_PASSWORD}
    volumes:
      - vault-secrets:/vault/output
    restart: "no"

  kafka:
    image: bitnami/kafka:3.7
    container_name: classic-ml-kafka
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: classic-ml-redis
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-secrets:/vault-secrets:ro
    command: >
      sh -c "REDIS_PASSWORD=$$(cat /vault-secrets/redis_password) &&
      exec redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDIS_PASSWORD=$$(cat /vault-secrets/redis_password) && redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    image: mshanturov/classic_developer_ml_cicle:latest
    container_name: classic-ml-api
    environment:
      REDIS_HOST_FILE: /vault-secrets/redis_host
      REDIS_PORT_FILE: /vault-secrets/redis_port
      REDIS_DB_FILE: /vault-secrets/redis_db
      REDIS_PASSWORD_FILE: /vault-secrets/redis_password
      KAFKA_BOOTSTRAP_SERVERS_FILE: /vault-secrets/kafka_bootstrap_servers
      KAFKA_TOPIC_FILE: /vault-secrets/kafka_topic
      KAFKA_GROUP_ID_FILE: /vault-secrets/kafka_group_id
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
      MESSAGE_BUS_BACKEND: kafka
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - vault-secrets:/vault-secrets:ro
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-consumer:
    build: .
    container_name: classic-ml-kafka-consumer
    command: ["python3", "src/kafka_consumer_service.py"]
    environment:
      REDIS_HOST_FILE: /vault-secrets/redis_host
      REDIS_PORT_FILE: /vault-secrets/redis_port
      REDIS_DB_FILE: /vault-secrets/redis_db
      REDIS_PASSWORD_FILE: /vault-secrets/redis_password
      KAFKA_BOOTSTRAP_SERVERS_FILE: /vault-secrets/kafka_bootstrap_servers
      KAFKA_TOPIC_FILE: /vault-secrets/kafka_topic
      KAFKA_GROUP_ID_FILE: /vault-secrets/kafka_group_id
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - vault-secrets:/vault-secrets:ro

  web-dev:
    build: .
    profiles: ["dev"]
    command: >
      bash -c "python3 src/preprocess.py && python3 src/train.py --model ALL --use-config &&
      python3 -m uvicorn src.api_service:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      REDIS_HOST_FILE: /vault-secrets/redis_host
      REDIS_PORT_FILE: /vault-secrets/redis_port
      REDIS_DB_FILE: /vault-secrets/redis_db
      REDIS_PASSWORD_FILE: /vault-secrets/redis_password
      KAFKA_BOOTSTRAP_SERVERS_FILE: /vault-secrets/kafka_bootstrap_servers
      KAFKA_TOPIC_FILE: /vault-secrets/kafka_topic
      KAFKA_GROUP_ID_FILE: /vault-secrets/kafka_group_id
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      PREDICTION_STORE_BACKEND: redis
      MESSAGE_BUS_BACKEND: kafka
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./:/app
      - vault-secrets:/vault-secrets:ro
    ports:
      - "8012:8000"

  functional-tests:
    build: .
    profiles: ["cd"]
    environment:
      SCENARIO_BASE_URL: http://web:8000
    depends_on:
      web:
        condition: service_healthy
      kafka-consumer:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - vault-secrets:/vault-secrets:ro
    command: ["python3", "src/functional_api_test.py"]

volumes:
  vault-secrets:
