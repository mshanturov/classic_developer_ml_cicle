version: '3.8'

services:
  web:
    build: .
    image: mshanturov/classic_developer_ml_cicle:latest
    container_name: classic-ml-api
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'curl -fsS http://localhost:8000/health || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web-dev:
    build: .
    profiles: ["dev"]
    command: >
      bash -c "python3 src/preprocess.py && python3 src/train.py --model ALL --use-config &&
      python3 -m uvicorn src.api_service:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app
    ports:
      - "8012:8000"

  functional-tests:
    build: .
    profiles: ["cd"]
    depends_on:
      web:
        condition: service_healthy
    command: ["python3", "src/functional_api_test.py"]
