stages:
  prepare:
    cmd: python3 scripts/prepare_data.py --input data/raw/seeds_dataset.txt --train-output data/processed/train.csv --test-output data/processed/test.csv --test-size 0.2 --random-state 42
    deps:
      - scripts/prepare_data.py
      - src/ml_pipeline/data.py
      - data/raw/seeds_dataset.txt
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python3 scripts/train.py --train-path data/processed/train.csv --test-path data/processed/test.csv --model-path artifacts/model.joblib --metrics-path artifacts/metrics.json --config config.ini
    deps:
      - scripts/train.py
      - src/ml_pipeline/config.py
      - src/ml_pipeline/model.py
      - src/ml_pipeline/evaluate.py
      - data/processed/train.csv
      - data/processed/test.csv
      - config.ini
    outs:
      - artifacts/model.joblib
    metrics:
      - artifacts/metrics.json

  evaluate:
    cmd: python3 scripts/evaluate.py --test-path data/processed/test.csv --model-path artifacts/model.joblib --metrics-path artifacts/metrics_cd.json
    deps:
      - scripts/evaluate.py
      - artifacts/model.joblib
      - data/processed/test.csv
    metrics:
      - artifacts/metrics_cd.json
